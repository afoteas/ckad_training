name: go-integration-kind-demo

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          rm -f kubectl

      - name: Create kind cluster
        run: |
          kind create cluster --name ci
          kubectl cluster-info --context kind-ci

      - name: Run integration tests and export JUnit
        run: |
          go test ./... -tags=integration -v -timeout=10m 2>&1 | tee test-output.txt
          go install github.com/jstemmer/go-junit-report/v2@latest
          cat test-output.txt | go-junit-report -set-exit-code > junit.xml

      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: junit.xml

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl get ns
          kubectl get pods -A -o wide
          kubectl describe pods -A
          kubectl logs -A --all-containers=true --tail=200

      - name: Cleanup kind cluster
        if: always()
        run: kind delete cluster --name ci
