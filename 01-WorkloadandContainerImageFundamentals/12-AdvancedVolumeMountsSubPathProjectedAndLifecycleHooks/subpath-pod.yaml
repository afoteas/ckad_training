apiVersion: v1
kind: Pod
metadata:
  name: subpath-demo
spec:
  containers:
  - name: app
    image: busybox
    command: ["sh", "-c", "cat /config/welcome.txt && sleep 3600"]
    volumeMounts:
    - name: cfg
      mountPath: /config/welcome.txt
      subPath: welcome.txt          # mount only this key as a single file
      readOnly: true
  volumes:
  - name: cfg
    configMap:
      name: app-config
