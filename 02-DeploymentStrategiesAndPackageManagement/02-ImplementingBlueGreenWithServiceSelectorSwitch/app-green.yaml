apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: color-app
      version: green
  template:
    metadata:
      labels:
        app: color-app
        version: green # <-- Pod label 2
    spec:
      containers:
      - name: nginx-green
        image: nginx:alpine
        command: ["/bin/sh", "-c"]
        args: ["echo '<h1>Welcome to GREEN - Version 2.0</h1>' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"]
        ports:
        - containerPort: 80