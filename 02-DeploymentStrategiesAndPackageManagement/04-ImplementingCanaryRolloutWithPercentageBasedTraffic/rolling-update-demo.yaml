apiVersion: apps/v1
kind: Deployment
metadata:
  name: critical-api
spec:
  replicas: 5 # Start with 5 desired replicas
  selector:
    matchLabels:
      app: api
  # ----------------------------------------------------
  # Default Rolling Update Strategy (maxUnavailable: 25%, maxSurge: 25%)
  # The default is to allow 1 Pod down and 1 Pod extra (25% of 5 is 1.25, rounded down/up)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1 # Allow one Pod to be unavailable (Default 25% of 5 = 1)
      maxSurge: 1       # Allow one extra Pod to be created (Default 25% of 5 = 1)
  # ----------------------------------------------------
  template:
    metadata:
      labels:
        app: api
        version: v1.0
    spec:
      containers:
      - name: api-container
        image: nginx:latest
        command: ["/bin/sh", "-c"]
        args: ["echo '<h1>API v1.0</h1>' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"]
        ports:
        - containerPort: 80