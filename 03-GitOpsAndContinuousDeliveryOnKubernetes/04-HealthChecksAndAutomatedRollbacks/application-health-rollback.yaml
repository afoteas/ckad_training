apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ckad-sample
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/afoteas/ckad_training.git
    targetRevision: main
    path: WorkloadandContainerImageFundamentals/CreatePVCAndMountItToDeployment
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
    syncOptions:
      - CreateNamespace=true
