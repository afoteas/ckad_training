apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: podinfo-auto
  namespace: flux-system
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: "chore(images): update podinfo image"
    push:
      branch: main
  update:
    path: ./GitOpsAndContinuousDeliveryOnKubernetes/09-ImageUpdateAutomationAndPRBasedApproval
    strategy: Setters
