name: production-ready-cicd

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
      - 'prod*'
  pull_request:
    branches: [ main, develop ]

env:
  IMAGE_NAME: my-app
  REGISTRY: ghcr.io

jobs:
  lint-and-test:
    name: Lint and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go unit tests with coverage
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic

  helm-lint:
    name: Helm Lint and Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint ./chart

      - name: Render templates
        run: |
          helm template my-app ./chart > rendered.yaml

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate schemas with kubeconform
        run: kubeconform -strict -summary rendered.yaml

      - name: Server dry-run validation
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: ci-validate

      - name: Apply dry-run
        run: kubectl apply --dry-run=server -f rendered.yaml

      - name: Cleanup validation cluster
        if: always()
        run: kind delete cluster --name ci-validate

  build-and-push:
    name: Build Multi-Arch Images
    runs-on: ubuntu-latest
    needs: [lint-and-test, helm-lint]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG_STAGING}" | base64 -d > ~/.kube/config
        env:
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Deploy chart to staging
        run: |
          helm upgrade --install my-app ./chart \
            --namespace staging \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }} \
            --set image.tag=sha-${{ github.sha }}

      - name: Smoke and health checks
        run: |
          kubectl rollout status deploy/my-app -n staging --timeout=180s
          kubectl get pods -n staging

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/prod')
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG_PRODUCTION}" | base64 -d > ~/.kube/config
        env:
          KUBE_CONFIG_PRODUCTION: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Deploy chart to production
        run: |
          helm upgrade --install my-app ./chart \
            --namespace production \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }} \
            --set image.tag=sha-${{ github.sha }}

      - name: Verify deployment
        run: |
          kubectl rollout status deploy/my-app -n production --timeout=180s
          kubectl get pods -n production

      - name: Rollback on failure
        if: failure()
        run: |
          helm rollback my-app 0 -n production || true
          kubectl get events -n production --sort-by=.lastTimestamp
          kubectl describe deploy my-app -n production || true
