apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack-config
  namespace: monitoring # Assuming Prometheus/Alertmanager are in the 'monitoring' namespace
stringData:
  alertmanager.yml: |
    global:
      # Placeholder for the Slack webhook URL. Replace this with your actual URL.
      slack_api_url: 'YOUR_SLACK_WEBHOOK_URL'
    route:
      group_by: ['alertname', 'cluster']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: 'slack-notifications'
    receivers:
      - name: 'slack-notifications'
        slack_configs:
          - channel: '#alerts-demo' # Change to your Slack channel
            send_resolved: true
            title: '[{{ .Status | toUpper }}] CPU Alert for {{ .Labels.pod }}'
            text: |
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Severity:* {{ .Labels.severity }}
              *Details:*
              {{ range .Alerts }}
                - *Pod:* {{ .Labels.pod }}
                - *Value:* {{ printf "%.2f" .Annotations.value }}% CPU
              {{ end }}