apiVersion: batch/v1
kind: Job
metadata:
  name: retry-on-failure-job
spec:
  # This field tells the Job controller how many times to retry the Pod
  # before considering the Job a failure.
  backoffLimit: 5 
  template:
    metadata:
      name: retry-pod
    spec:
      restartPolicy: OnFailure
      containers:
      - name: fail-then-succeed
        image: bitnami/kubectl:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            if [ ! -f /data/counter ]; then echo 0 > /data/counter; fi
            COUNT=$(cat /data/counter)
            echo "Current failed count: $COUNT"
            if [ $COUNT -lt 3 ]; then
              COUNT=$((COUNT + 1))
              echo $COUNT > /data/counter
              echo "This is attempt $COUNT. Failing on purpose..."
              exit 1
            else
              echo "Failed 3 times. This is the success attempt!"
              exit 0
            fi
      volumes:
      - name: data
        emptyDir: {}