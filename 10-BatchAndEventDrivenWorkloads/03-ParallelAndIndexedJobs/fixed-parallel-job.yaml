apiVersion: batch/v1
kind: Job
metadata:
  name: fixed-parallel-demo
spec:
  completions: 4
  parallelism: 2
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Fixed worker pod: $(hostname)"
              echo "Running identical work item"
              sleep 5
              echo "Done"
