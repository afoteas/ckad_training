apiVersion: batch/v1
kind: Job
metadata:
  name: indexed-chunk-processor
spec:
  completions: 10
  parallelism: 5
  completionMode: Indexed
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          env:
            - name: TOTAL_CHUNKS
              value: "50"
            - name: WORKERS
              value: "10"
          command: ["/bin/sh", "-c"]
          args:
            - |
              INDEX=$JOB_COMPLETION_INDEX
              CHUNKS_PER_WORKER=$((TOTAL_CHUNKS / WORKERS))
              START=$((INDEX * CHUNKS_PER_WORKER))
              END=$((START + CHUNKS_PER_WORKER - 1))
              echo "Worker index: $INDEX"
              echo "Processing chunks $START to $END"
              sleep 3
              echo "Worker $INDEX complete"
