apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dist-compute
spec:
  # Mark the whole JobSet complete when the "leader" Job finishes successfully.
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - leader
  replicatedJobs:
    # A single coordinator/leader Job.
    - name: leader
      replicas: 1
      template:
        spec:
          backoffLimit: 0
          completions: 1
          parallelism: 1
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: leader
                  image: busybox:1.36
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      echo "Leader starting on host: $(hostname)"
                      echo "Coordinating 3 workers..."
                      sleep 10
                      echo "Leader done."
    # Three worker Jobs that run alongside the leader.
    - name: workers
      replicas: 1
      template:
        spec:
          backoffLimit: 0
          completions: 3
          parallelism: 3
          completionMode: Indexed
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: worker
                  image: busybox:1.36
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      echo "Worker index $JOB_COMPLETION_INDEX on host: $(hostname)"
                      echo "Doing partitioned work..."
                      sleep 5
                      echo "Worker $JOB_COMPLETION_INDEX complete."
