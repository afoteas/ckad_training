apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: pod-reader # Reference the SA created in step 1
    namespace: default
roleRef:
  kind: Role
  name: pod-reader-role # Reference the Role created in step 2
  apiGroup: rbac.authorization.k8s.io
