apiVersion: apps/v1
kind: Deployment
metadata:
  name: constrained-nginx-deployment
  labels:
    app: constrained-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: constrained-nginx
  template:
    metadata:
      labels:
        app: constrained-nginx
    spec:
      containers:
      - name: nginx-container
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"