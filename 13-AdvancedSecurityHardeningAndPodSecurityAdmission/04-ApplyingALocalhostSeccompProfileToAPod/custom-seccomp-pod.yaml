apiVersion: v1
kind: Pod
metadata:
  name: custom-seccomp-pod
spec:
  securityContext:
    seccompProfile:
      type: Localhost
      localhostProfile: custom-profile.json
  containers:
  - name: tester
    image: busybox:1.36
    command: ["sh", "-c", "echo 'Testing network bind...' && nc -l -p 8080"]
