apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-with-spread
spec:
  replicas: 6
  selector:
    matchLabels:
      app: nginx-with-spread
  template:
    metadata:
      labels:
        app: nginx-with-spread
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: nginx-with-spread
      containers:
      - name: nginx
        image: nginx
