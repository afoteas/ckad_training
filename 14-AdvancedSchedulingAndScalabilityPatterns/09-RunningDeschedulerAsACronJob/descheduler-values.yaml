schedule: "0 2 * * *"

deschedulerPolicy:
  profiles:
  - name: default
    pluginConfig:
    - name: LowNodeUtilization
      args:
        thresholds:
          cpu: 20
          memory: 20
          pods: 20
        targetThresholds:
          cpu: 50
          memory: 50
          pods: 50
    plugins:
      balance:
        enabled:
        - LowNodeUtilization
