apiVersion: v1
data:
  APP_MODE: prod
  LOG_LEVEL: debug
kind: ConfigMap
metadata:
  name: app-settings
  namespace: ckad-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: configured-app
  name: configured-app
  namespace: ckad-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configured-app
  template:
    metadata:
      labels:
        app: configured-app
    spec:
      containers:
      - command: [sh, -c, sleep 3600]
        image: busybox:1.36
        name: busybox
        env:
          - name: APP_MODE
            valueFrom:
              configMapKeyRef:
                name: app-settings
                key: APP_MODE
          - name: LOG_LEVEL
            valueFrom:
              configMapKeyRef:
                name: app-settings
                key: LOG_LEVEL
