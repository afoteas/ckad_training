apiVersion: v1
kind: Pod
metadata:
  name: web-logger
  namespace: ckad-design
spec:
  volumes:
    - name: logs
      emptyDir: {}
  containers:
    - image: busybox:1.36
      name: writer
      command: [sh, -c, "while true; do date >> /var/log/app/out.log; sleep 5; done"]
      volumeMounts:
      - name: logs
        mountPath: /var/log/app
    - image: busybox:1.36
      name: reader
      command: [sh, -c, "tail -f /var/log/app/out.log"]
      volumeMounts:
      - name: logs
        mountPath: /var/log/app
  restartPolicy: Never