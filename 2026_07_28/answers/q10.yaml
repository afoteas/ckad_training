apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
  namespace: app-batch
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      name: report
    spec:
      template:
        spec:
          containers:
          - command:
            - sh
            - -c
            - echo report generated
            image: busybox:1.36
            name: report
          restartPolicy: OnFailure
  schedule: '*/10 * * * *'
