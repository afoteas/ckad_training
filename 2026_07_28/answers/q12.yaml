apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger
  labels: 
    app: logger
  namespace: app-design
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger
  template:
    metadata:
      labels:
        app: logger
    spec:
      initContainers:
        - image: busybox:1.36
          name: sidecar
          restartPolicy: Always
          volumeMounts:
            - name: varlog
              mountPath: "/var/log/app"
          command: ["sh", "-c", "tail -f /var/log/app/access.log"]
      containers:
        - image: busybox:1.36
          name: app
          command: ["sh", "-c", "while true; do echo hit >> /var/log/app/access.log; sleep 3; done"]
          volumeMounts:
            - name: varlog
              mountPath: "/var/log/app"
      volumes:
        - name: varlog
          emptyDir: {}
