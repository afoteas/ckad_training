apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 1. Reference the base configuration
resources:
- ../../base
commonLabels:
  env: prod
patches:
- target:
    kind: Deployment
    name: web-app
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 5
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 200m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi