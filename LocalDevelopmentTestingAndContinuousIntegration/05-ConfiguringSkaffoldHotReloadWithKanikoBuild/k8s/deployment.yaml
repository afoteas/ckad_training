apiVersion: apps/v1
kind: Deployment
metadata:
  name: skaffold-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skaffold-demo-app
  template:
    metadata:
      labels:
        app: skaffold-demo-app
    spec:
      containers:
        - name: app
          image: skaffold-demo-app
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_MESSAGE
              value: "perfectly working hot reload with kaniko build"
---
apiVersion: v1
kind: Service
metadata:
  name: skaffold-demo-app
spec:
  selector:
    app: skaffold-demo-app
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
