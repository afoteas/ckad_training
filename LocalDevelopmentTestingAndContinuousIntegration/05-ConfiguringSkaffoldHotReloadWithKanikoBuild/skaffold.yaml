apiVersion: skaffold/v4beta6
kind: Config
metadata:
  name: skaffold-demo
build:
  local:
    push: false
  artifacts:
    - image: skaffold-demo-app
      docker:
        dockerfile: Dockerfile
manifests:
  rawYaml:
    - k8s/deployment.yaml
deploy:
  kubectl: {}
portForward:
  - resourceType: service
    resourceName: skaffold-demo-app
    port: 80
    localPort: 8080
profiles:
  # In-cluster build with Kaniko (build runs in a pod, not the local Docker daemon).
  # Kaniko always PUSHES the image, so it needs a registry. On minikube:
  #   minikube addons enable registry -p mini-ckad
  # then run:
  #   skaffold dev -p kaniko --default-repo localhost:5000
  - name: kaniko
    build:
      cluster:
        namespace: default
      artifacts:
        - image: skaffold-demo-app
          kaniko:
            dockerfile: Dockerfile

