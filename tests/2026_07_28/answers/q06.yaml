apiVersion: v1
kind: Pod
metadata:
  labels:
    run: secure-pod
  name: secure-pod
  namespace: app-secure
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
  containers:
  - command:
    - sh
    - -c
    - sleep 3600
    image: busybox:1.36
    name: secure-pod
    securityContext:
      capabilities:
        drop:
          - ALL
      allowPrivilegeEscalation: false
  restartPolicy: Never
