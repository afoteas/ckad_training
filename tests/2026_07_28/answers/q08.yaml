apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: checker
  name: checker
  namespace: app-health
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checker
  template:
    metadata:
      labels:
        app: checker
    spec:
      containers:
      - command:
        - sh
        - -c
        - touch /tmp/healthy && sleep 3600
        image: busybox:1.36
        name: busybox
        livenessProbe:
          exec:
            command:
            - cat
            - /tmp/healthy
          initialDelaySeconds: 5
          periodSeconds: 10
        startupProbe:
          exec:
            command:
            - cat
            - /tmp/healthy
          failureThreshold: 10
          periodSeconds: 5
