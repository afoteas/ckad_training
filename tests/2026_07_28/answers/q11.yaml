apiVersion: batch/v1
kind: Job
metadata:
  name: crunch
  namespace: app-batch
spec:
  parallelism: 2
  completions: 4
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
      - command:
        - sh
        - -c
        - echo processing; sleep 5
        image: busybox:1.36
        name: crunch
