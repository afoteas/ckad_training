apiVersion: v1
kind: Pod
metadata:
  labels:
    run: env-single
  name: env-single
  namespace: exam-config
spec:
  containers:
  - command:
    - sh
    - -c
    - 'sleep 3600'
    image: busybox:1.36
    name: env-single
    env:
      - name: GREETING
        valueFrom:
          configMapKeyRef:
            name: shared-cfg
            key: message
  restartPolicy: Never
