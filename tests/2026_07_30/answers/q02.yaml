apiVersion: batch/v1
kind: Job
metadata:
  name: bulk
  namespace: build
spec:
  completions: 6
  parallelism: 2
  template:
    spec:
      containers:
      - command:
        - sh
        - -c
        - echo processing; sleep 5
        image: busybox:1.36
        name: bulk
      restartPolicy: Never
