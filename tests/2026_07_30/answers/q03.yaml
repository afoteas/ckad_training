apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
  namespace: build
spec:
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      name: report
    spec:
      template:
        spec:
          containers:
          - command:
            - sh
            - -c
            - echo report
            image: busybox:1.36
            name: report
          restartPolicy: OnFailure
  schedule: '*/5 * * * *'
