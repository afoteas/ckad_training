apiVersion: v1
kind: Pod
metadata:
  name: gated
  namespace: build
spec:
  initContainers:
  - command:
    - sh
    - -c
    - "until nslookup payments.build.svc.cluster.local; do echo waiting; sleep 2; done"
    image: busybox:1.36
    name: wait
  containers:
  - image: nginx:1.25
    name: app
  restartPolicy: Never
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: payments
  name: payments
  namespace: build
spec:
  ports:
  - name: "80"
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: payments
  type: ClusterIP
status:
  loadBalancer: {}
