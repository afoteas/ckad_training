apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---

apiVersion: v1
kind: Pod
metadata:
  name: data-pod
  namespace: storage
spec:
  containers:
  - image: nginx:1.25
    name: data-pod
    volumeMounts:
    - mountPath: /usr/share/nginx/html
      name: pvc-vol
  restartPolicy: Never
  volumes:
    - name : pvc-vol
      persistentVolumeClaim:
        claimName: data-pvc
