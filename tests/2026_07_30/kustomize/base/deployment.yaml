apiVersion: apps/v1
kind: Deployment
metadata:
  name: kbase
  labels: {app: kbase}
spec:
  replicas: 1
  selector: {matchLabels: {app: kbase}}
  template:
    metadata: {labels: {app: kbase}}
    spec:
      containers:
      - name: nginx
        image: nginx:1.24
        ports: [{containerPort: 80}]
