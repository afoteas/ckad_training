apiVersion: batch/v1
kind: Job
metadata:
  name: import
  namespace: workloads
spec:
  parallelism: 3
  completions: 10
  activeDeadlineSeconds: 60
  template:
    spec:
      containers:
      - command:
        - sh
        - -c
        - echo import started; sleep 10; echo import finished
        image: busybox:1.36
        name: import
      restartPolicy: Never
