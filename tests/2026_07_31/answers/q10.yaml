apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitor
  namespace: rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-reader
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - nodes
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitor-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-reader
subjects:
- kind: ServiceAccount
  name: monitor
  namespace: rbac
---

apiVersion: v1
kind: Pod
metadata:
  labels:
    run: agent
  name: agent
  namespace: rbac
spec:
  containers:
  - image: nginx:1.25
    name: agent
    resources: {}
  serviceAccountName: monitor
  restartPolicy: Never
