apiVersion: v1
kind: Pod
metadata:
  labels:
    run: worker
  name: worker
  namespace: limits
spec:
  containers:
  - command:
    - sh
    - -c
    - sleep 3600
    image: busybox:1.36
    name: worker
    resources: 
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "250m"
  restartPolicy: Never
