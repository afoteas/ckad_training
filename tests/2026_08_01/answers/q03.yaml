apiVersion: batch/v1
kind: Job
metadata:
  name: partition-ingest
  namespace: batch
spec:
  completions: 8
  parallelism: 2
  activeDeadlineSeconds: 90
  backoffLimit: 2
  template:
    spec:
      containers:
      - command:
        - sh
        - -c
        - sleep 3 & echo job finished!
        image: busybox:1.36
        name: partition-ingest
      restartPolicy: Never
