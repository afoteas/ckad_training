apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime-toggles
  namespace: settings
data:
  # property-like keys; each key maps to a simple value
  log_level: debug
  shard: "us-east-1"
---
apiVersion: v1
kind: Pod
metadata:
  name: toggle-reader
  namespace: settings
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
      env:
        # Define the environment variable
        - name: LOG_LEVEL 
          valueFrom:
            configMapKeyRef:
              name: runtime-toggles
              key: log_level
        - name: SHARD_ID
          valueFrom:
            configMapKeyRef:
              name: runtime-toggles
              key: shard
