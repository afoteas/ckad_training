apiVersion: v1
kind: Pod
metadata:
  labels:
    run: compute
  name: compute
  namespace: quota
spec:
  containers:
  - args:
    - sleep
    - "3600"
    image: busybox:1.36
    name: compute
    resources:
      requests:
        memory: "128Mi"
        cpu: "200m"
      limits:
        memory: "256Mi"
        cpu: "500m"
  restartPolicy: Never
