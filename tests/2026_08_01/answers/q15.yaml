apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mesh-deny-all
  namespace: mesh
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mesh-allow-front-to-back
  namespace: mesh
spec:
  podSelector:
    matchLabels:
      role: backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: frontend
    ports:
    - protocol: TCP
      port: 8080
