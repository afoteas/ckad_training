apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-cap
  namespace: policy
spec:
  hard:
    pods: 10
    requests.cpu: "2"
---

apiVersion: v1
kind: Pod
metadata:
  labels:
    run: quota-ok
  name: quota-ok
  namespace: policy
spec:
  containers:
  - args:
    - sleep
    - "3600"
    image: busybox:1.36
    name: quota-ok
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
  restartPolicy: Never
