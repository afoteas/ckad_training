apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-deny-ingress
  namespace: edge
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-allow-scrape
  namespace: edge
spec:
  podSelector:
    matchLabels:
      app: exporter
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          zone: monitoring
    ports:
    - protocol: TCP
      port: 9100
