apiVersion: batch/v1
kind: Job
metadata:
  name: integrity-sweep
  namespace: batch
spec:
  parallelism: 3
  completions: 6
  backoffLimit: 2 
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 7200
  template:
    metadata: {}
    spec:
      containers:
      - image: busybox:1.36
        name: integrity-sweep
        command: [sh, -c, "sleep 5; echo finished"]
      restartPolicy: Never
