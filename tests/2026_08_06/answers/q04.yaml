apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-gen
  namespace: batch
spec:
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 15
  jobTemplate:
    metadata:
      name: report-gen
    spec:
      activeDeadlineSeconds: 30
      template:
        spec:
          containers:
          - command:
            - sh
            - -c
            - sleep 2; echo done job
            image: busybox:1.36
            name: report-gen
          restartPolicy: OnFailure
  schedule: '*/2 * * * *'
