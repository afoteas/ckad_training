apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-bot
  namespace: access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-manager
  namespace: access
rules:
- resources:
  - pods
  verbs:
  - get
  - list
  apiGroups: [""]
- resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  apiGroups: ["apps"]
---
apiVersion: rbac.authorization.k8s.io/v1
# This cluster role binding allows anyone in the "manager" group to read secrets in any namespace.
kind: RoleBinding
metadata:
  name: deploy-bot-binding
  namespace: access
subjects:
- kind: ServiceAccount
  name: deploy-bot
  apiGroup: ""
roleRef:
  kind: Role
  name: deploy-manager
  apiGroup: ""
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: bot
  name: bot
  namespace: access
spec:
  serviceAccountName: deploy-bot
  containers:
  - image: nginx:1.25
    name: bot
  restartPolicy: Always
