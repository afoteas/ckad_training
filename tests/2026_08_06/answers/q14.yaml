apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: edge
spec:
  ingressClassName: nginx
  rules:
  - host: "shop.internal"
    http:
      paths:
      - pathType: Prefix
        path: "/api"
        backend:
          service:
            name: shop-api
            port:
              number: 8080
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: shop-ui
            port:
              number: 80
