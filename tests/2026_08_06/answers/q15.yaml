apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mesh-default-deny
  namespace: mesh
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mesh-allow-api
  namespace: mesh
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: frontend
    - namespaceSelector:
        matchLabels:
          team: ops
    ports:
    - protocol: TCP
      port: 8080
